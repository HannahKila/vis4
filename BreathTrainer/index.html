<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breath Control Trainer</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 30px;
        font-family: Arial, sans-serif;
        background-color: #f5f5f0;
        color: #263a31;
      }

      /* Main container */
      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 30px;
        background-color: #f5f5f0;
        border-radius: 24px;
      }

      /* Header */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }

      .header h1 {
        font-size: 24px;
        margin: 0 0 8px;
        letter-spacing: 1px;
      }

      .header p {
        font-size: 13px;
        color: #788379;
        margin: 0;
      }

      .wind-icon {
        width: 48px;
        height: 48px;
        background-color: #e2e9df;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 25px;
      }

      .divider {
        height: 1px;
        background-color: #dce0d8;
        margin-bottom: 25px;
      }

      /* Duration section */
      .duration {
        text-align: center;
        margin-bottom: 25px;
      }

      .section-label {
        font-size: 12px;
        font-weight: bold;
        color: #637064;
        letter-spacing: 1px;
        margin-bottom: 15px;
      }

      .duration-control {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 25px;
      }

      .duration-control h2 {
        font-size: 36px;
        margin: 0;
      }

      .duration-control span {
        font-size: 15px;
        color: #788379;
      }

      .adjust-btn {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 50%;
        background-color: #e3e8df;
        color: #344d3d;
        font-size: 22px;
      }

      /* Airflow card */
      .airflow-card {
        background-color: #ffffff;
        padding: 22px;
        border-radius: 18px;
        margin-bottom: 25px;
      }

      .airflow-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .airflow-header h3 {
        font-size: 12px;
        letter-spacing: 1px;
        color: #647267;
        margin: 0;
      }

      .status {
        color: #568161;
        font-size: 12px;
        font-weight: bold;
      }

      .chart {
        width: 100%;
        height: auto;
        display: block;
      }

      .chart-labels {
        display: flex;
        justify-content: space-between;
        color: #879086;
        font-size: 10px;
        margin-top: 10px;
      }

      /* Consistency score */
      .score {
        text-align: center;
        margin: 25px 0;
      }

      .score h2 {
        font-size: 42px;
        margin: 0 0 5px;
      }

      .score p {
        font-size: 12px;
        letter-spacing: 1px;
        color: #647267;
        margin: 0;
      }

      /* Buttons */
      .start-btn {
        display: block;
        width: 100%;
        padding: 17px;
        background-color: #344d3d;
        color: white;
        border: none;
        border-radius: 14px;
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 1px;
        text-align: center;
      }

      .footer {
        text-align: center;
        color: #8a9189;
        font-size: 11px;
        margin-top: 20px;
      }

      /* Responsive layout */
      @media (max-width: 480px) {
        body {
          padding: 12px;
        }

        .container {
          padding: 20px;
        }

        .header h1 {
          font-size: 20px;
        }
      }
    </style>
  </head>

  <body>

    <div class="container">

      <!-- Header -->
      <div class="header">
        <div>
          <h1>BREATH TRAINER</h1>
          <p>Breathing practice for singing</p>
        </div>

        <div class="wind-icon">〰</div>
      </div>

      <div class="divider"></div>

      <!-- Duration -->
      <div class="duration">
        <div class="section-label">BREATHING DURATION</div>

        <div class="duration-control">
          <button class="adjust-btn">−</button>
          <h2>10 <span>sec</span></h2>
          <button class="adjust-btn">+</button>
        </div>
      </div>

      <!-- Airflow visualization -->
      <div class="airflow-card">

        <div class="airflow-header">
          <h3>LIVE AIRFLOW</h3>
          <div class="status">● STEADY</div>
        </div>

        <svg class="chart"
             viewBox="0 0 320 105"
             xmlns="http://www.w3.org/2000/svg">

          <!-- Grid lines -->
          <g stroke="#e9ede6"
             stroke-width="1"
             stroke-dasharray="4 4">
            <line x1="8" y1="20" x2="312" y2="20"/>
            <line x1="8" y1="40" x2="312" y2="40"/>
            <line x1="8" y1="60" x2="312" y2="60"/>
            <line x1="8" y1="80" x2="312" y2="80"/>
          </g>

          <!-- Airflow curve -->
          <path
            d="M8 53
               C28 52 35 48 48 51
               S70 56 88 52
               S112 49 128 52
               S150 55 168 52
               S190 48 208 52
               S232 55 248 52
               S275 49 292 51
               S303 52 312 50"
            stroke="#639a70"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"/>
        </svg>

        <div class="chart-labels">
          <span>START</span>
          <span>AIRFLOW STABILITY</span>
          <span>END</span>
        </div>
      </div>

      <!-- Consistency score -->
      <div class="score">
        <h2>85%</h2>
        <p>FLOW CONSISTENCY</p>
      </div>

      <!-- Start button -->
      <button class="start-btn">
        ▶ &nbsp; START TRAINING
      </button>

      <div class="footer">
        Breathe steadily. Find your flow.
      </div>

    </div>

  </body>
</html>
