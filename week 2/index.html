
<!DOCTYPE html>
<html>
<head>
    <title>Week 2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="navbar">
        <h1>Navigation Bar</h1>
        <button id="changeColorBtn">Change Header Color</button>
    </div>

    <div id="main-content">
    <div class="sidebar">
        <h3>Sidebar Navigation</h3>
    </div>

    <div class="content">
        <h3>Main Content</h3>
    <div>
    <script>
        document
            .getElementById("changeColorBtn")
            .addEventListener("click", function() {

                document
                    .querySelector("#navbar h1")
                    .style
                    .color = "green";

            });
    </script>
   
</body>
</html>
